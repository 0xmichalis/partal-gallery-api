name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "41 5 * * 1"
  workflow_dispatch:

jobs:
  checks:
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-ci.yml@595ae285704a99ff17e78188d073fb107adac555
    with:
      run-deny: false

  lint:
    uses: 0xmichalis/repo-tooling/.github/workflows/dockerfile-lint.yml@595ae285704a99ff17e78188d073fb107adac555

  postgres-only:
    name: Check PostgreSQL-only dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject active SQLite dependencies
        shell: bash
        run: |
          # The SQLite advisory exception requires this crate to stay unused.
          dependencies="$(cargo tree --locked --workspace --all-features --target all --prefix none --format '{p}')"
          if grep -q '^libsqlite3-sys ' <<< "$dependencies"; then
            echo "::error::SQLite is active; remove its audit exception and update to a patched version."
            exit 1
          fi

  docker-publish:
    needs: [checks, lint, postgres-only]
    if: github.ref == 'refs/heads/main'
    # Serialize publishing so an older run cannot move latest after a newer one.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    permissions:
      packages: write
      contents: read
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-docker-publish.yml@595ae285704a99ff17e78188d073fb107adac555
    with:
      image: ghcr.io/${{ github.repository_owner }}/partal-gallery-api
    secrets:
      signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      signing-password: ${{ secrets.COSIGN_PASSWORD }}
