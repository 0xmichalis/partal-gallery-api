name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "41 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Check Format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all-features

  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: "Dockerfile"

  docker-publish:
    name: Build, Sign and Push Docker Image
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, lint]
    if: github.ref == 'refs/heads/main' # Only run on main branch
    # Serialize publishing so an older run cannot move latest after a newer one.
    concurrency:
      group: docker-publish
      cancel-in-progress: false

    permissions:
      packages: write # Required for GHCR push
      contents: read

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/partal-gallery-api

    steps:
      # This job holds the image signing key, so its actions are pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD)
          docker build --pull --build-arg GIT_COMMIT="$GIT_COMMIT" -t "$IMAGE_NAME:sha-$GITHUB_SHA" .

      # latest only ever points at a signed digest of main's newest commit.
      - name: Publish signed image
        id: push
        uses: 0xmichalis/repo-tooling/actions/publish-image@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
          token: ${{ github.token }}
