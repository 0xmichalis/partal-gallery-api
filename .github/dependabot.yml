version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "06:00"
    # Match the Cargo cooldown in .cargo/config.toml, which Dependabot's cargo runs also apply.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      # Keep major updates separate for individual review.
      cargo-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
