name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "41 5 * * 1"
  workflow_dispatch:

jobs:
  checks:
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-ci.yml@8f5e2c876d4c1e711bdf8bdea66188daff8e6166
    with:
      run-deny: false

  lint:
    uses: 0xmichalis/repo-tooling/.github/workflows/dockerfile-lint.yml@8f5e2c876d4c1e711bdf8bdea66188daff8e6166

  docker-publish:
    needs: [checks, lint]
    if: github.ref == 'refs/heads/main'
    # Serialize publishing so an older run cannot move latest after a newer one.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    permissions:
      packages: write
      contents: read
    uses: 0xmichalis/repo-tooling/.github/workflows/rust-docker-publish.yml@8f5e2c876d4c1e711bdf8bdea66188daff8e6166
    with:
      image: ghcr.io/${{ github.repository_owner }}/partal-gallery-api
    secrets:
      signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
      signing-password: ${{ secrets.COSIGN_PASSWORD }}
